name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Build tags are required: with_utls (REALITY), with_gvisor (TUN stack),
      # with_clash_api (runtime control). See Makefile.
      - run: go vet -tags "with_utls with_gvisor with_clash_api" ./...
      - run: go build -tags "with_utls with_gvisor with_clash_api" ./...
      - run: go test -tags "with_utls with_gvisor with_clash_api" ./...
